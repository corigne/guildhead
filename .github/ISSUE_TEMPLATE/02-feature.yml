name: Feature request
description: Suggest a new feature or improvement.
type: Feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Keep each request focused on one idea.
  - type: textarea
    id: need
    attributes:
      label: What would this help you do?
      description: Describe the problem or missing capability.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe how you would like it to work.
    validations:
      required: true
