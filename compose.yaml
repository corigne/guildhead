services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - guildhead_data:/data
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_COMMAND_NAME: ${DISCORD_COMMAND_NAME:-wow}
      DISCORD_HELP_COMMAND_NAME: ${DISCORD_HELP_COMMAND_NAME:-help}
      DISCORD_CRAFT_COMMAND_NAME: ${DISCORD_CRAFT_COMMAND_NAME:-craft}
      DISCORD_LFG_COMMAND_NAME: ${DISCORD_LFG_COMMAND_NAME:-lfg}
      DISCORD_LFG_CHANNEL_ID: ${DISCORD_LFG_CHANNEL_ID:-}
      DISCORD_ROSTER_COMMAND_NAME: ${DISCORD_ROSTER_COMMAND_NAME:-roster}
      DISCORD_CHARACTER_COMMAND_NAME: ${DISCORD_CHARACTER_COMMAND_NAME:-character}
      DISCORD_COMMAND_CHANNEL_ID: ${DISCORD_COMMAND_CHANNEL_ID:-}
      DISCORD_COMMAND_POST_CHANNEL_IDS: ${DISCORD_COMMAND_POST_CHANNEL_IDS:-}
      DISCORD_CHANNEL_IDS: ${DISCORD_CHANNEL_IDS:?Set DISCORD_CHANNEL_IDS}
      WOWHEAD_FLAVORS: ${WOWHEAD_FLAVORS:-forever}
      BLIZZARD_CLIENT_ID: ${BLIZZARD_CLIENT_ID:-}
      BLIZZARD_CLIENT_SECRET: ${BLIZZARD_CLIENT_SECRET:-}
      BLIZZARD_REGION: ${BLIZZARD_REGION:-us}
      BLIZZARD_OAUTH_REDIRECT_URI: ${BLIZZARD_OAUTH_REDIRECT_URI:-}
      BLIZZARD_GUILD_NAME: ${BLIZZARD_GUILD_NAME:-}
      GUILD_ANNOUNCEMENT_CHANNEL_ID: ${GUILD_ANNOUNCEMENT_CHANNEL_ID:-}
      GUILD_ANNOUNCE_EVENTS: ${GUILD_ANNOUNCE_EVENTS:-joins}
      GUILD_ROSTER_POLL_MINUTES: ${GUILD_ROSTER_POLL_MINUTES:-10}
      GUILD_ROLE_SYNC_ENABLED: ${GUILD_ROLE_SYNC_ENABLED:-false}
      GUILD_WELCOME_ENABLED: ${GUILD_WELCOME_ENABLED:-false}
      GUILD_WELCOME_MESSAGE_FILE: ${GUILD_WELCOME_MESSAGE_FILE:-}
      GUILDHEAD_DATA_DIR: /data

volumes:
  guildhead_data:
